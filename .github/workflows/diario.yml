name: Enviar Dashboard Diario

on:
  schedule:
    # UTC 12:00 = 7:00 AM hora CDMX (GMT-6) o 6:00 AM en horario de verano
    # Ajusta la hora según prefieras. Usa https://crontab.guru
    - cron: '0 12 * * *'
  workflow_dispatch:  # permite ejecutar manualmente desde GitHub

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Ejecutar script
        env:
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TELEFONO: ${{ secrets.TELEFONO }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python dashboard.py

      - name: (Opcional) Subir log como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mensaje-log
          path: mensaje.log
